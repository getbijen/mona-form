<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mona Creation - Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #2f2f2f;
      background: #fff;
    }
    .banner {
      height: 200px;
      background: linear-gradient(180deg, #4a3414 0%, #7a5820 60%, #8f6a26 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .banner .logo {
      color: #f1e6cf;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: 72px;
      letter-spacing: 12px;
      margin: 0;
      font-weight: 500;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .tagline {
      font-size: 14px;
      margin: 0 0 32px;
    }
    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .req { color: #c0392b; margin-left: 4px; }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
    }
    input[type="text"],
    input[type="tel"],
    input[type="email"] {
      width: 100%;
      max-width: 240px;
      height: 40px;
      padding: 0 12px;
      font-size: 15px;
      border: 1px solid #c9c9c9;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    select[multiple] {
      width: 100%;
      max-width: 320px;
      padding: 6px;
      font-size: 15px;
      border: 1px solid #c9c9c9;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    select[multiple] option { padding: 6px 8px; }
    input:focus, select:focus {
      outline: 2px solid #8f6a26;
      outline-offset: 1px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .checkbox-row input { width: 16px; height: 16px; margin: 0; }
    .checkbox-row span { font-size: 14px; }
    button {
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #msg {
      margin: 14px 0 0;
      font-size: 13px;
      min-height: 18px;
    }
    #msg.error { color: #c0392b; }
    #msg.success { color: #2e7d32; }
    .hp { position: absolute; left: -9999px; height: 0; width: 0; opacity: 0; }
  </style>
</head>

    <p class="tagline">Claim your 5% discount with your purchase!</p>

    <form id="customer-form" novalidate>
      <div class="field">
        <label for="name">Your Name Please!<span class="req">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="mobile">Mobile Number<span class="req">*</span></label>
        <input type="tel" id="mobile" name="mobile" autocomplete="tel" inputmode="numeric"
               maxlength="15" required>
        <div class="hint">Digits only, 10 to 15 numbers.</div>
      </div>

      <div class="field">
        <label for="email">Email Id (Optional)</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="100">
      </div>

      <div class="field">
        <label for="product">Products I am interested in.</label>
        <select id="product" name="product" multiple size="4">
          <!-- TODO: replace with your real product list -->
         <option value="Kaaju">Kaaju</option>
          <option value="Kishmish">Kishmish</option>
          <option value="Badaam">Badaam</option>
          <option value="Khazoor">Khazoor</option>
          <option value="Any Other">Any Other</option>
          <option value="All of them">All of them</option>
        </select>
        <div class="hint">Hold Ctrl (Windows) or Cmd (Mac) to select more than one.</div>
      </div>

      <div class="field">
        <label>Please tick the box below to know our upcoming offers &amp; discounts</label>
        <div class="checkbox-row">
          <input type="checkbox" id="offers" name="offers" value="Yes">
          <label for="offers" style="font-weight:400;margin:0;"><span>Yes, I am in.</span></label>
        </div>
      </div>

      <!-- Honeypot: hidden from people, bots tend to fill it in -->
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="submit-btn">Submit &rarr;</button>
      <p id="msg" role="status"></p>
    </form>
  </main>

  <script>
    // Paste the Web app URL from Google Apps Script here
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIGLHQDzAlrQlU-MIb15ORwcarQbEnDsD713h7jYfuaPi7nDvD1mKgxCzwfDOimt-hqw/exec";

    const form = document.getElementById("customer-form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit-btn");
    const mobileInput = document.getElementById("mobile");
    const emailInput = document.getElementById("email");

    // Mobile: keep digits only, as the customer types or pastes
    mobileInput.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 15);
    });

    // Email: remove spaces as the customer types or pastes
    emailInput.addEventListener("input", function () {
      this.value = this.value.replace(/\s/g, "");
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      msg.className = "";
      msg.textContent = "";

      // Bot check
      if (form.website.value) return;

      const name = form.name.value.trim();
      const mobile = mobileInput.value;
      const email = emailInput.value.trim();

      if (!name) {
        showError("Please enter your name.");
        return;
      }
      if (!/^\d{10,15}$/.test(mobile)) {
        showError("Please enter a valid mobile number (10 to 15 digits).");
        return;
      }
      // Email is optional, but if entered it must be a valid address
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        showError("Please enter a valid email address, or leave it blank.");
        return;
      }

      // Collect all selected products as a list
      const products = Array.from(form.product.selectedOptions).map(function (o) { return o.value; });

      const data = new FormData();
      data.append("name", name);
      data.append("mobile", mobile);
      data.append("email", email);
      data.append("products", products.join(", "));
      data.append("offers", form.offers.checked ? "Yes" : "No");

      btn.disabled = true;
      btn.textContent = "Submitting...";

      // mode "no-cors" is required for Apps Script; the response can't be read,
      // so we show success once the request is sent.
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: data })
        .then(function () {
          msg.className = "success";
          msg.textContent = "Thank you for connecting with Mona Creation! We'll keep you updated.";
          form.reset();
        })
        .catch(function () {
          showError("Something went wrong. Please try again.");
        })
        .finally(function () {
          btn.disabled = false;
          btn.innerHTML = "Submit &rarr;";
        });
    });

    function showError(text) {
      msg.className = "error";
      msg.textContent = text;
    }
  </script>
</body>
</html>
